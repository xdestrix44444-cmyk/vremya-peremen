# Выкладывает папку game/ на GitHub Pages при каждом пуше в main
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Номер сборки для сброса кэша Telegram
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s/__BUILD__/$V/g" game/index.html game/ui.js
          echo "{\"v\":\"$V\"}" > game/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
