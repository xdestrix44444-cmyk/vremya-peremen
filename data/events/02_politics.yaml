  type: choice
  when: {from: 1991, to: 1993}
  who:
    age: [21, 65]
  text: Предложение должности в новой мэрии или администрации.
  choices:
  - text: Принять
    check:
      base: 20
      edu: {university: 15, technikum: 5}
      ties: 0.4
      defender91: 25
      front: 20
      deputy_local: 15
      activist: 10
      official: 10
      gkchp: -30
      interfront: -25
    success:
      text: Кабинет, секретарь, телефон с гербом.
      effects: {ties: 10, money_m: 1}
      sets: [official]
      job: official
    fail:
      text: Место отдали другому.
      effects: {}
  - text: Отказаться
    effects: {}
