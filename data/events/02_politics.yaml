  choices:
  - text: Продолжать
    outcomes:
    - w: 70
      text: Ещё один год в оппозиции.
      effects: {fame: 5, law: 5}
    - w: 25
      text: Обыск дома.
      effects: {law: 10, close: -4}
    - w: 5
      text: Нападение в подъезде.
      effects: {health: -15}
