title: 2. Политика (POL)
note: 'Ступени: Слушатель → Активист → Депутат местного совета → Депутат республики → Дума, губернатор, чиновник или оппозиция.'
events:
- id: POL-01
  type: choice
  when: {from: 1986, to: 1990}
  who:
    age: [16, 75]
  weight: 2
  text: Ночью на кухне друг читает вслух «Огонёк». Спорите до трёх утра.
  choices:
  - text: Ввязаться в спор
    effects: {ties: 1, views_reform: 8}
    sets: [arguer]
  - text: Сменить тему
    effects: {close: 1}
- id: POL-02
  type: choice
  when: {from: 1987, to: 1990}
  who:
    age: [17, 70]
  text: Знакомые зовут на митинг неформалов. Милиция переписывает фамилии.
  choices:
  - text: Пойти
    check:
      base: 75
      arguer: 10
      year: {1987: -15, 1988: -10}
    success:
      text: Тысячи людей, самодельные плакаты, ощущение, что всё можно.
      effects: {ties: 2, views_reform: 10}
      sets: [activist]
    fail:
      text: Задержали, сообщили на работу.
      effects: {law: 8, ties: -2}
      sets: [activist]
  - text: Не идти
    effects: {}
- id: POL-03
  type: choice
  when: {from: 1988, to: 1991}
  who:
    age: [17, 75]
    flags: [activist]
  text: На собраниях спорят до хрипоты. Каждое движение зовёт к себе — пора решить, с кем ты.
  choices:
  - text: Народный фронт или демократы
    effects: {views_reform: 15, views_union: 15, ties: 1}
    sets: [front]
  - text: Интерфронт или «За Союз»
    effects: {views_reform: -10, views_union: -20, ties: 1}
    sets: [interfront]
  - text: «Мемориал»
    effects: {views_reform: 15, know: 3, close: 1}
  - text: Экологи
    effects: {views_reform: 5, ties: 1}
- id: POL-04
  type: choice
  when: {from: 1988, to: 1990}
  who:
    flags: [activist]
    role: [young, adult]
  text: Партком вызывает «на беседу» о твоих митингах.
  choices:
  - text: Отступить
    effects: {ties: -2, views_reform: -3}
  - text: Стоять на своём
    check:
      base: 70
      ties: 0.3
      year: {1988: -15}
    success:
      text: Пожурили и отпустили. О тебе заговорили.
      effects: {fame: 5}
    fail:
      text: Лишили премии и очереди на квартиру.
      effects: {money_m: -2, close: -3, fame: 5}
- id: POL-05
  type: choice
  when: {from: 1990, to: 1990, month: 3}
  who:
    age: [21, 70]
    role: [young, adult, pension]
    any_flags: [activist, official, party_member, komsomol_active, front, interfront, defender91, deputy_local]
  text: 'Весна 1990-го: первые альтернативные выборы в местные советы и Верховные Советы республик. Предлагают выдвинуться в горсовет.'
  choices:
  - text: Выдвинуться
    check:
      base: 15
      edu: {university: 10, technikum: 3}
      official: 10
      activist: 10
      front: 8
      interfront: 8
      party_member: 5
      ties: 0.3
      charm: 8
    success:
      text: Ты депутат горсовета.
      effects: {fame: 10, ties: 8}
      sets: [deputy_local]
    fail:
      text: Проиграл, но тебя запомнили.
      effects: {fame: 4}
  - text: Отказаться
    effects: {}
- id: POL-06
  type: choice
  when: {from: 1990, to: 1990, month: 3}
  who:
    age: [21, 70]
    flags: [deputy_local]
  weight: 0.5
  text: В тот же день выбирают и Верховный Совет республики. Можно идти и туда.
  choices:
  - text: Идти
    check:
      base: 30
      edu: {university: 15}
      official: 10
      fame: 0.3
      ties: 0.3
      charm: 10
    success:
      text: Ты народный депутат республики.
      effects: {fame: 15, ties: 10}
      sets: [deputy_rep]
    fail:
      text: Проиграл. Остаёшься в горсовете.
      effects: {fame: 3}
  - text: Остаться в горсовете
    effects: {}
- id: POL-07
  type: choice
  when: {from: 1990, to: 1993}
  who:
    flags: [deputy_local]
  repeat: true
  text: 'Сессия горсовета до ночи: делят особняки и лицензии. В коридоре коммерсант просит «на два слова».'
  choices:
  - text: Взять конверт
    outcomes:
    - w: 80
      text: Деньги взял, бумагу подписал.
      effects: {money_m: 6, law: 10}
    - w: 20
      mods: {law: 0.5}
      text: Через год об этом пишет газета.
      effects: {money_m: 6, law: 25, fame: -5}
  - text: Отказаться
    effects: {ties: -3, fame: 2}
  - text: Публично рассказать об этом
    check: {base: 50, fame: 0.4}
    success:
      text: Скандал в прессе, тебя знают как честного.
      effects: {fame: 12}
    fail:
      text: Скандал замяли, а тебя перестали звать на важные заседания.
      effects: {ties: -8, fame: 3}
- id: POL-08
  type: choice
  when: {from: 1990, to: 1991}
  who:
    flags: [deputy_rep]
  text: Голосование о независимости республики.
  choices:
  - text: За
    effects: {views_union: 20, fame: 3}
  - text: Против
    effects: {views_union: -20, fame: 3}
  - text: Воздержаться
    effects: {ties: -3, happy: 2}
