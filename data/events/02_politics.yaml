  choices:
  - text: Народный фронт
    effects: {ties: 3, views_union: 20}
    sets: [front, activist]
  - text: Добровольцы в охрану парламента
    effects: {fit: 2, ties: 2, views_union: 20}
    sets: [front]
  - text: Работать в новой администрации
    check: {base: 40, know: 0.4, ties: 0.4}
