- id: POL-11
  type: choice
  when: {from: 1994, to: 1999}
  who:
    flags: [deputy_duma]
  repeat: true
  text: Лоббисты, телекамеры и «нужный» закон.
  choices:
  - text: Взять деньги за голос
    outcomes:
    - w: 85
      text: Закон прошёл, у тебя новая дача.
      effects: {money_m: 20, law: 10}
    - w: 15
      text: Журналисты раскопали.
      effects: {money_m: 20, law: 25, fame: -10}
