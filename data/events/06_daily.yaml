title: 6. Быт (DAY)
note: Повседневные события. Появляются чаще всего и задают ощущение эпохи.
events:
- id: DAY-01
  type: scene
  repeat: true
  when: {from: 1986, to: 1991}
  who:
    age: [14, 99]
  text: В гастроном завезли колбасу. Очередь вдоль витрины, тётка в конце пишет номера ручкой на ладонях.
  variants: ['В гастроном завезли колбасу. Очередь вдоль витрины, тётка в конце пишет номера ручкой на ладонях.', 'Кто-то крикнул: «Сосиски дают!» — и полдвора побежало к магазину.']
  chance: 0.3
  effects: {happy: 2, close: 1}
- id: DAY-02
  type: choice
  when: {from: 1986, to: 1991}
  who:
    age: [20, 99]
  text: Записались на ковёр. Каждую ночь в одиннадцать перекличка у мебельного — пропустил, вычеркнут.
  choices:
  - text: Отмечаться
    effects: {health: -2, close: 1, money_m: -1, happy: 3}
    memo: Месяц отмечался ночами в очереди — и достал ковёр.
  - text: Плюнуть
    effects: {}
  variants: ['Записались на ковёр. Каждую ночь в одиннадцать перекличка у мебельного — пропустил, вычеркнут.']
- id: DAY-03
  type: scene
  repeat: true
  when: {from: 1986, to: 1991}
  who:
    role: [young, adult]
  text: На работе раздают праздничные заказы. Тебе достались шпроты и банка индийского кофе.
  effects: {close: 1}
  texts_by_age: {school: 'Родителям на работе дали праздничный заказ: шпроты и банка кофе.'}
  variants: [На работе раздают праздничные заказы. Тебе достались шпроты и банка индийского кофе., 'Профком принёс заказ к Новому году: палка сервелата, обёрнутая в газету «Труд».']
- id: DAY-05
  type: scene
  repeat: true
  when: {from: 1987, to: 1995}
  who:
    age: [10, 50]
  text: В подвале ДК крутят «Рэмбо». Переводчик гнусавит в нос, зал смотрит не дыша.
  variants: ['В подвале ДК крутят «Рэмбо». Переводчик гнусавит в нос, зал смотрит не дыша.', 'Видеосалон за углом: сеанс за рубль, на двери мелом написано «Брюс Ли».']
  focus: [hobby, balance]
  chance: 0.5
  effects: {ties: 2, happy: 2}
- id: DAY-06
  type: choice
  when: {from: 1988, to: 1990}
  who:
    age: [16, 99]
  text: По телевизору Кашпировский и Чумак «заряжают» воду и кремы.
  choices:
  - text: Ставить банку перед экраном
    effects: {close: 1, happy: 1}
  - text: Смеяться
    effects: {ties: 1, happy: 2}
- id: DAY-07
  type: choice
  when: {from: 1988, to: 1993}
  who:
    age: [12, 99]
  text: Открываются храмы и мечети. Родня зовёт креститься или на праздник в мечеть.
  choices:
  - text: Пойти
    effects: {close: 1, happy: 2, money_m: -0.2}
    memo: Пошёл в храм — впервые в жизни.
  - text: Нет
    effects: {}
- id: DAY-08
  type: choice
  when: {from: 1989, to: 1991}
  who:
    age: [18, 99]
  text: 'Сосед стучит в дверь: «Меняю два водочных талона на сахарный. Тебе ж не надо?»'
  choices:
  - text: Меняться
    effects: {ties: 1, happy: 1, law: 1}
  - text: Нет
    effects: {}
  variants: ['Сосед стучит в дверь: «Меняю два водочных талона на сахарный. Тебе ж не надо?»']
- id: DAY-09
  type: scene
  when: {from: 1990, to: 1991}
  text: В гастрономе на полках только берёзовый сок в трёхлитровых банках и морская капуста.
  effects: {views_reform: -3}
  texts_by_age: {school: Мама вернулась из магазина с пустой сумкой.}
  variants: [В гастрономе на полках только берёзовый сок в трёхлитровых банках и морская капуста., 'Продавщица смотрит сквозь тебя: «Ничего нет. И не будет».']
- id: DAY-10
  type: scene
  when: {from: 1991, to: 1992}
  who:
    role: [pension]
  text: '«Гуманитарка» из Германии: банки тушёнки, пакеты с поношенной одеждой.'
  effects: {close: 1}
- id: DAY-11
  type: scene
  repeat: true
  when: {from: 1991, to: 1999, month: 5}
  who:
    any_flags: [village, hobby_garden]
    age: [12, 90]
  weight: 2
  text: 'Майские праздники. Электричка битком: все едут сажать картошку.'
  variants: ['Майские праздники. Электричка битком: все едут сажать картошку.', 'Тесть звонит в шесть утра: «Выезжаем на участок, сажать пора».']
  effects: {money_m: 1, fit: 2, happy: 1}
- id: DAY-12
  type: scene
  when: {from: 1992, to: 1993}
  text: Вместо гастронома — рынок у вокзала. С ящиков продают «Сникерсы», турецкие куртки и спирт «Ройял».
  variants: ['Вместо гастронома — рынок у вокзала. С ящиков продают «Сникерсы», турецкие куртки и спирт «Ройял».']
- id: DAY-13
  type: choice
  when: {from: 1992, to: 1996}
  who:
    role: [adult, pension]
  text: 'В БТИ очередь с семи утра: все оформляют квартиры в собственность.'
  choices:
  - text: Оформить
    effects: {money_m: -1, close: 1}
  - text: Не связываться
    effects: {}
  variants: ['В БТИ очередь с семи утра: все оформляют квартиры в собственность.']
- id: DAY-14
  type: scene
  repeat: true
