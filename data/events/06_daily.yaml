  where: [UA, GE, TJ, KG, MD, AZ]
  weight: 0.6
  text: Свет и отопление отключают по графику. Готовят на буржуйке, спят в куртках.
  effects: {health: -2}
- id: DAY-16
  type: scene
  when: {from: 1988, to: 1999}
  text: Девять вечера. Вся семья молча смотрит «Санта-Барбару», телефон отключён из розетки.
  effects: {close: 1}
  variants: ['Девять вечера. Вся семья молча смотрит «Санта-Барбару», телефон отключён из розетки.', Бабушка плачет над «Рабыней Изаурой» и просит не мешать.]
- id: DAY-18
  type: scene
  when: {from: 1993, to: 1995}
  text: По телевизору Лёня Голубков покупает жене сапоги на доходы от пирамиды.
- id: DAY-21
  type: scene
  repeat: true
  when: {from: 1986, to: 1999, month: 12}
  text: 31 декабря. На столе оливье, на телевизоре «Голубой огонёк», на балконе мёрзнет шампанское.
  effects: {close: 1}
  variants: ['31 декабря. На столе оливье, на телевизоре «Голубой огонёк», на балконе мёрзнет шампанское.', 'Новый год. Мандарины пахнут на всю квартиру, куранты бьют под звон рюмок.']
  chance: 0.5
