title: 4. Бизнес и своё дело (BIZ)
note: 'Ступени: Фарца → Кооператив или челнок → Ларёк или точка → Магазин или фирма → Торговый дом, банк, завод. Механика своего дела — CONCEPT §3.11.'
events:
- id: BIZ-01
  type: choice
  when: {from: 1986, to: 1989}
  who:
    age: [15, 35]
    flags: [capital]
  text: У гостиницы «Интурист» иностранцы меняют джинсы на значки, икру и матрёшки.
  choices:
  - text: Фарцевать
    check:
      base: 70
      grit: 10
      charm: 5
      year: {1986: -10}
    success:
      text: Первые «настоящие» деньги и джинсы Levi's.
      effects: {money_m: 2, ties: 1, law: 5}
      sets: [entrepreneur]
    fail:
      text: Взяли с поличным. Статья за спекуляцию.
      effects: {law: 25, close: -5}
  - text: Нет
    effects: {}
- id: BIZ-02
  type: choice
  when: {from: 1987, to: 1991}
  who:
    role: [young, adult]
  weight: 0.4
  text: 'Знакомый открывает кооператив: шьют «варёнки» в подвале. Зовёт к себе.'
  choices:
  - text: Уйти в кооператив
    outcomes:
    - w: 65
      mods: {grit: 1}
      text: Платят втрое, на старой работе косятся.
      effects: {money_m: 4, ties: 1}
      sets: [entrepreneur]
      job: coop
    - w: 20
      text: Пришли рэкетиры. Деньги есть, но страшно.
      effects: {money_m: 2}
      sets: [entrepreneur]
      job: coop
    - w: 15
      text: Кооператив закрыли через полгода.
      effects: {money_m: -1}
      job: unemployed
  - text: Остаться
    effects: {}
  variants: ['Знакомый открывает кооператив: шьют «варёнки» в подвале. Зовёт к себе.']
- id: BIZ-03
  type: choice
  repeat: true
  when: {from: 1988, to: 1991}
  who:
    job: [coop]
  text: 'В цех заходят трое в спортивных костюмах: «Хорошо работаете. Защита нужна?»'
  choices:
  - text: Платить
    effects: {money_m: -2}
  - text: Отказать
    outcomes:
    - w: 40
      mods: {ties: 0.3, strength: 5}
      text: Отстали.
      effects: {ties: 1}
    - w: 35
      text: Разгромили цех.
      effects: {money_m: -6}
      sets: [stubborn]
    - w: 25
      text: Избили во дворе.
      effects: {health: -10}
      sets: [stubborn]
  - text: Найти своих
    check: {base: 35, ties: 0.6, served: 10, afghan: 15}
    success:
      text: Ребята из союза ветеранов прикрывают.
      effects: {money_m: -1}
      sets: [own_roof]
    fail:
      text: Свои оказались хуже чужих.
      effects: {money_m: -3}
