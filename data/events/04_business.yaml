  text: 'Поездка за товаром: Стамбул, клетчатые сумки по сорок кило. На границе таможенник намекает на «подарок».'
  choices:
  - text: Дать таможне «на лапу»
    outcomes:
    - w: 75
      text: Таможенник отвернулся. Товар распродал за неделю.
      effects: {money_m: 3.5, fit: -1}
    - w: 15
      text: Взятку взяли, а половину товара всё равно отобрали.
      effects: {money_m: -0.5}
    - w: 10
      text: Ограбили в поезде на обратном пути.
      effects: {money_m: -3, health: -3}
    effects: {money_m: -0.5}
  - text: Везти без взятки
    outcomes:
    - w: 50
      mods: {grit: 10, fit: 0.2}
      text: Проскочил, вся прибыль твоя.
      effects: {money_m: 5}
    - w: 40
      text: Товар конфисковали.
      effects: {money_m: -5}
    - w: 10
      text: Протокол и штраф.
      effects: {money_m: -3, law: 10}
