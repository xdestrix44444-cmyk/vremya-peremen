title: "1. Хроника эпохи (H)"
note: "Обязательные события. Срабатывают у всех, кто подходит по месту и возрасту, сверх годового бюджета событий."
events:
# ---------- 1986–1988 ----------
- id: H-86-01
  type: choice
  fixed: true
  when: {from: 1986, to: 1986, month: 3}
  who: {age: [18, 99]}
  text: "Антиалкогольная кампания. Водку продают с 14:00, очередь на квартал, сахар пропал: все гонят самогон."
  choices:
    - {text: Гнать самогон, effects: {money_m: 1, health: -2, law: 5}}
    - {text: Не пить вообще, effects: {health: 3, ties: -2}}
    - {text: Доставать по блату, check: {base: 50, ties: 0.5}, success: {text: "Достал, всё как у людей.", effects: {ties: 1}}, fail: {text: "Не вышло. Осталось без праздника.", effects: {close: -1}}}
- id: H-86-02
  type: choice
  fixed: true
  when: {from: 1986, to: 1986, month: 5}
  where: [UA, BY]
  who: {age: [18, 99]}
  text: "Первомайская демонстрация идёт как обычно, а через неделю по улицам ездят поливальные машины. О радиации почти молчат."
  choices:
    - {text: Увезти детей к родне подальше, effects: {money_m: -1, close: 1}}
    - text: Остаться
      outcomes:
        - {w: 70, text: "Ничего заметного не случилось. Пока."}
        - {w: 30, mods: {chernobyl_zone: 40}, text: "Через пару лет у ребёнка щитовидка.", effects: {close: -3}}
- id: H-86-03
  type: choice
  fixed: true
  when: {from: 1986, to: 1986, month: 6}
  who: {age: [20, 45], sex: m, stats: {fit: ">40"}, not_flags: [whiteticket]}
  weight: 0.15
  text: "Повестка на «военные сборы». Все понимают, что это Чернобыль."
  choices:
    - {text: Ехать, effects: {money_m: 3, health: -3, ties: 1}, sets: [liquidator]}
    - text: Откосить
      check: {base: 25, ties: 0.6}
      success: {text: "Справка из поликлиники помогла.", effects: {ties: -1}}
      fail: {text: "Не вышло. Едешь.", effects: {health: -3, money_m: 3}, sets: [liquidator]}
- id: H-86-04
  type: choice
  fixed: true
  when: {from: 1986, to: 1986, month: 12}
  where: [KZ]
  who: {age: [16, 30]}
  text: "Алма-Ата. Студенты вышли на площадь против назначения нового первого секретаря. Ночью площадь разгоняют."
  choices:
    - text: Пойти на площадь
      outcomes:
        - {w: 60, text: "Видел всё своими глазами. Потом долго об этом молчал.", effects: {views_union: 15, close: -2}}
        - {w: 30, text: "Задержали, исключили из института или комсомола.", effects: {law: 15, know: -5, views_union: 25}}
        - {w: 10, text: "Сильно избили при разгоне.", effects: {health: -10, views_union: 25}}
    - {text: Сидеть дома, effects: {}}
- id: H-87-01
  type: news
  fixed: true
  when: {from: 1987, to: 1987, month: 5}
  text: "Вступил в силу закон об индивидуальной трудовой деятельности: можно официально шить, чинить, подвозить."
- id: H-88-01
  type: news
  fixed: true
  when: {from: 1988, to: 1988, month: 2}
  where: [AZ, AM]
  text: "Карабах просится в Армению. Митинги в Ереване и Степанакерте, погромы армян в Сумгаите."
- id: H-88-02
  type: news
  fixed: true
  when: {from: 1988, to: 1988, month: 5}
  text: "Закон о кооперации: можно открывать своё дело. Знакомые шьют «варёнки» и открывают кафе."
- id: H-88-03
  type: choice
  fixed: true
  when: {from: 1988, to: 1988, month: 6}
  where: [LT, LV, EE]
  who: {age: [14, 99]}
  text: "Поющая революция: Саюдис и народные фронты, на концертах поют запрещённые песни, над сценой флаги."
  choices:
    - {text: Ходить на митинги, effects: {ties: 2, views_union: 20, views_reform: 10}, sets: [activist]}
    - {text: Держаться в стороне, effects: {}}
- id: H-88-04
  type: choice
  fixed: true
  when: {from: 1988, to: 1988, month: 12}
  where: [AM]
  text: "7 декабря, 11:41. Землетрясение. Спитак разрушен почти полностью, Ленинакан наполовину."
  choices:
    - text: Ехать разбирать завалы
      effects: {health: -3, close: 1, ties: 1}
    - {text: Сдать кровь и деньги, effects: {money_m: -1, close: 1}}

# ---------- 1989–1990 ----------
- id: H-89-01
  type: news
  fixed: true
  when: {from: 1989, to: 1989, month: 2}
  text: "Последний советский солдат вышел из Афганистана."
- id: H-89-02
  type: choice
  fixed: true
  when: {from: 1989, to: 1989, month: 4}
  where: [GE]
  who: {age: [14, 70]}
  text: "Тбилиси. Митинг у Дома правительства идёт несколько дней."
  choices:
    - text: Пойти на митинг
      outcomes:
        - {w: 75, text: "Ночью 9 апреля митинг разогнали войска. Ты успел уйти.", effects: {views_union: 30, close: -2}}
        - {w: 20, text: "Попал в давку при разгоне.", effects: {health: -10, views_union: 35}}
        - {w: 5, text: "Отравился газом при разгоне, долго лечился.", effects: {health: -20, views_union: 35}}
    - {text: Остаться дома, effects: {views_union: 10}}
- id: H-89-03
  type: scene
  fixed: true
  when: {from: 1989, to: 1989, month: 5}
  who: {age: [16, 99]}
  text: "Съезд народных депутатов в прямом эфире. Страна сидит у телевизоров, на работе спорят о Сахарове."
  effects: {views_reform: 5}
- id: H-89-04
  type: choice
  fixed: true
  when: {from: 1989, to: 1989, month: 6}
  where: [UZ]
  who: {age: [14, 99]}
  weight: 0.3
  text: "Ферганская долина. Погромы турок-месхетинцев, войска вывозят людей."
  choices:
    - text: Укрыть соседей
      outcomes:
        - {w: 85, text: "Две ночи соседи прятались у вас в подвале.", effects: {close: 2}, sets: [helped_neighbors]}
        - {w: 15, text: "Вам угрожали, но обошлось.", effects: {close: 1, health: -3}, sets: [helped_neighbors]}
    - {text: Не вмешиваться, effects: {close: -2}}
- id: H-89-05
  type: choice
  fixed: true
  when: {from: 1989, to: 1989, month: 7}
  where: [RU, UA, KZ]
  who: {job: [miner]}
  text: "Шахтёры бастуют. Касками по асфальту на площади."
  choices:
    - {text: Выйти на площадь, effects: {ties: 3, views_reform: 15, fame: 3}, sets: [activist]}
    - {text: Работать, effects: {ties: -2}}
- id: H-89-06
  type: choice
  fixed: true
  when: {from: 1989, to: 1989, month: 8}
  where: [LT, LV, EE]
  who: {age: [12, 99]}
  text: "23 августа. Балтийский путь: живая цепь от Таллина до Вильнюса."
  choices:
    - {text: Встать в цепь, effects: {ties: 1, close: 1, views_union: 20}}
    - {text: Смотреть дома по телевизору, effects: {}}
- id: H-90-01
  type: news
  fixed: true
  when: {from: 1990, to: 1990, month: 1}
  where: [AZ, AM]
  text: "Баку: погромы армян, потом в город входят войска. Чёрный январь."
- id: H-90-02
  type: choice
  fixed: true
  when: {from: 1990, to: 1990, month: 2}
  where: [TJ]
  who: {age: [18, 99], flags: [minority]}
  text: "Беспорядки в Душанбе. Русские семьи впервые всерьёз думают уехать."
  choices:
    - text: Уехать в Россию
      effects: {money_m: -4, close: -3}
      sets: [migrant]
      outcomes:
        - {w: 100, text: "Продали квартиру за бесценок. Контейнер, поезд, родня под Саратовом.", move: RU}
    - {text: Остаться, effects: {}}
- id: H-90-03
  type: choice
  fixed: true
  when: {from: 1990, to: 1990, month: 4}
  where: [LT]
  who: {age: [16, 99]}
  text: "11 марта Литва объявила независимость. Москва ответила блокадой: бензина нет, газ по часам."
  choices:
    - {text: Пересесть на велосипед и держаться, effects: {fit: 3, views_union: 10}}
    - {text: Доставать бензин у военных, check: {base: 45, ties: 0.5}, success: {text: "Канистра раз в неделю.", effects: {money_m: -1, ties: 1}}, fail: {text: "Обманули с деньгами.", effects: {money_m: -1}}}
- id: H-90-04
  type: choice
  fixed: true
  when: {from: 1990, to: 1990, month: 6}
  where: [KG]
  who: {age: [14, 99]}
  weight: 0.3
  text: "Ош и Узген: столкновения между киргизами и узбеками."
  choices:
    - {text: Укрыть соседей, effects: {close: 2, health: -2}, sets: [helped_neighbors]}
    - {text: Уехать к родне, effects: {money_m: -1, close: -2}}
    - {text: Не выходить из дома, effects: {}}
- id: H-90-05
  type: choice
  fixed: true
  when: {from: 1990, to: 1990, month: 8}
  who: {flags: [smoker]}
  text: "Табачный кризис. Сигарет нет даже по талонам, курильщики перекрывают улицы."
  choices:
    - {text: Бросить, check: {base: 35, will: 15}, success: {text: "Бросил. Хоть какая-то польза от дефицита.", effects: {health: 3}, clears: [smoker]}, fail: {text: "Сорвался через неделю.", effects: {close: -1}}}
    - {text: Самосад и «бычки» в банке, effects: {health: -2}}
    - {text: Доставать по блату, check: {base: 50, ties: 0.5}, success: {text: "Блок «Явы» за три цены.", effects: {money_m: -0.5}}, fail: {text: "Не достал. Злой месяц.", effects: {close: -2}}}
- id: H-90-06
  type: choice
  fixed: true
  when: {from: 1990, to: 1990, month: 9}
  where: [MD]
  who: {age: [18, 99]}
  text: "Год назад молдавский стал государственным и перешёл на латиницу. Теперь на левом берегу провозглашена ПМР, на юге — Гагаузия."
  choices:
    - {text: Учить язык, effects: {know: 3}}
    - {text: Поддержать ПМР, effects: {views_union: -25, ties: 1}}
    - {text: Держаться в стороне, effects: {}}
- id: H-90-07
  type: news
  fixed: true
  when: {from: 1990, to: 1990, month: 11}
  text: "Республики объявляют суверенитет одна за другой. Пустые прилавки, талоны на мыло, сахар и водку."

# ---------- 1991 ----------
- id: H-91-01
  type: choice
  fixed: true
  when: {from: 1991, to: 1991, month: 1}
  who: {age: [18, 99]}
  text: "Павловская реформа: три дня, чтобы обменять 50- и 100-рублёвые купюры. Больше тысячи — только со справкой."
  choices:
    - {text: Стоять в очереди в сберкассе, effects: {health: -2}}
    - {text: Махнуть рукой, effects: {money_m: -1}}
    - {text: Обменять через знакомых, check: {base: 50, ties: 0.6}, success: {text: "Обменяли всё, даже заначку.", effects: {ties: 1}}, fail: {text: "Знакомый взял процент и половину потерял.", effects: {money_m: -2}}}
- id: H-91-02
  type: choice
  fixed: true
  when: {from: 1991, to: 1991, month: 1}
