  who: {age: [16, 80]}
  text: "Ночь на 13 января. Войска идут к телебашне в Вильнюсе. Люди встают живой стеной."
  choices:
    - text: Идти к телебашне
      outcomes:
        - {w: 85, text: "Простоял до утра в толпе.", effects: {ties: 2, views_union: 25}}
        - {w: 13, text: "Ранен в давке у телебашни.", effects: {health: -12, views_union: 30}}
        - {w: 2, text: "Погиб у телебашни.", end: death}
    - {text: Остаться дома, effects: {}}
- id: H-91-03
  type: choice
  fixed: true
  when: {from: 1991, to: 1991, month: 1}
  where: [LV]
  who: {age: [16, 80]}
  text: "Баррикады в Риге: самосвалы, бетонные блоки, костры у Домского собора."
  choices:
    - {text: Везти дрова на баррикады, effects: {ties: 3, health: -2, views_union: 20}, sets: [front]}
    - {text: Сидеть дома, effects: {}}
- id: H-91-04
  type: choice
  fixed: true
  when: {from: 1991, to: 1991, month: 3}
  where: [RU, UA, BY, UZ, KZ, AZ, KG, TJ, TM]
  who: {age: [18, 99]}
  text: "Референдум о сохранении Союза."
  choices:
    - {text: За, effects: {views_union: -15}}
    - {text: Против, effects: {views_union: 15}}
    - {text: Не идти, effects: {}}
- id: H-91-05
  type: news
  fixed: true
  when: {from: 1991, to: 1991, month: 4}
  text: "Цены подняли в два-три раза одним днём."
- id: H-91-06
  type: choice
  fixed: true
  when: {from: 1991, to: 1991, month: 8}
  who: {age: [18, 99]}
  text: "19 августа. По всем каналам «Лебединое озеро». В Москве танки на улицах."
  choices:
    - text: Идти к Белому дому
      who: {flags: [capital]}
      outcomes:
        - {w: 75, text: "Три ночи на баррикадах. Кажется, вы победили.", effects: {ties: 4, fame: 3, views_reform: 20}, sets: [defender91]}
        - {w: 24, text: "Простудился под дождём, но был там.", effects: {health: -3, views_reform: 20}, sets: [defender91]}
        - {w: 1, text: "Погиб в тоннеле на Садовом кольце.", end: death}
    - text: Поддержать ГКЧП
      who: {job: [official, officer, police]}
      outcomes:
        - {w: 60, mods: {region: {UZ: -40, TM: -40, TJ: -30, KZ: -20}}, text: "Через три дня всё кончилось. Начались проверки.", effects: {ties: -10, views_reform: -20}, sets: [gkchp]}
        - {w: 40, text: "Пересидел. Никто не вспомнил.", effects: {views_reform: -15}}
    - {text: Ждать, effects: {}}
- id: H-91-07
  type: news
  fixed: true
  when: {from: 1991, to: 1991, month: 9}
  text: "Республики объявляют независимость. С госучреждений снимают красные флаги."
- id: H-91-08
  type: choice
  fixed: true
  when: {from: 1991, to: 1991, month: 12}
  where: [UA]
  who: {age: [18, 99]}
  text: "1 декабря. Референдум о независимости Украины."
  choices:
    - {text: За, effects: {views_union: 15}}
    - {text: Против, effects: {views_union: -15}}
    - {text: Не идти, effects: {}}
- id: H-91-09
  type: scene
  fixed: true
  when: {from: 1991, to: 1991, month: 12}
  text: "26 декабря. Советского Союза больше нет. Пауза: что ты чувствуешь?"
- id: H-91-10
  type: choice
  fixed: true
  when: {from: 1991, to: 1991, month: 12}
  where: [GE]
  who: {age: [14, 99]}
  text: "В центре Тбилиси идут бои за Дом правительства."
  choices:
    - {text: Уехать к родне в деревню, effects: {money_m: -1, close: 1}}
    - {text: Остаться в городе, outcomes: [{w: 85, text: "Две недели без света и хлеба.", effects: {health: -3}}, {w: 15, text: "Попал под обстрел на проспекте.", effects: {health: -15}}]}

# ---------- 1992–1995 ----------
- id: H-92-01
  type: scene
  fixed: true
  when: {from: 1992, to: 1992, month: 1}
  text: "Цены отпустили. Сбережения теперь считаются в у.е., и видно, сколько от них осталось. Пауза: что ты чувствуешь?"
  effects: {views_reform: -5, close: -2}
- id: H-92-02
  type: news
  fixed: true
  when: {from: 1992, to: 1992, month: 2}
  where: [AZ, AM]
  text: "Ходжалы. Война за Карабах в разгаре."
- id: H-92-03
  type: choice
  fixed: true
  when: {from: 1992, to: 1992, month: 3}
  where: [MD]
  who: {age: [16, 99]}
  text: "Война в Приднестровье: Бендеры, мосты через Днестр."
