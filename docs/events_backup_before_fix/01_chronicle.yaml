        - {w: 17, text: "Тяжело ранен.", effects: {health: -20}}
        - {w: 3, text: "Погиб.", end: death}
    - {text: Укрыть соседей с другой стороны, outcomes: [{w: 90, text: "Неделю прятали их в доме.", effects: {close: 3}, sets: [helped_neighbors]}, {w: 10, text: "За это пришли к вам.", effects: {health: -10, close: 1}, sets: [helped_neighbors]}]}
- id: H-92-05
  type: choice
  fixed: true
  when: {from: 1992, to: 1992, month: 8}
  where: [GE]
  who: {age: [16, 99]}
  text: "Война в Абхазии."
  choices:
    - {text: Бежать через перевал, outcomes: [{w: 80, text: "Неделя в горах. Добрались до Тбилиси.", effects: {health: -6, money_m: -6}, sets: [refugee]}, {w: 20, text: "Потеряли всё, младший простыл в дороге.", effects: {health: -8, money_m: -10, close: -4}, sets: [refugee]}]}
