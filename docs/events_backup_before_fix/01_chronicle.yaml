- id: H-92-06
  type: news
  fixed: true
  when: {from: 1992, to: 1992, month: 10}
  where: [RU]
  text: "Каждому выдают ваучер номиналом 10 000. Обещают, что это две «Волги». Что с ним делать — раздел PRIV."
