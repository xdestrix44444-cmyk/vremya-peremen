title: "7. Детство и школа (KID)"
note: "До 7 лет решают родители: событие идёт строкой без выбора. Задатки открываются в разделе TAL."
events:
- id: KID-01
  type: scene
  who: {age: [0, 2]}
  text: "Ясли или бабушка. Решили за тебя."
  effects: {close: 1}
- id: KID-02
  type: scene
  who: {age: [3, 6]}
  text: "Детский сад: манная каша, тихий час, утренник в костюме снежинки или зайчика."
  effects: {ties: 1}
- id: KID-03
  type: scene
  who: {age: [0, 6]}
  repeat: true
  weight: 2
  text: "Болел: ветрянка, корь или свинка. Неделя дома с мамой."
  effects: {health: -1, close: 1}
- id: KID-04
  type: scene
  who: {age: [0, 6]}
  text: "Первое воспоминание: очередь за молоком с мамой, номер написан ручкой на ладони."
