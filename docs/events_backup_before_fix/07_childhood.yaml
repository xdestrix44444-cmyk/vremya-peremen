    - {text: Ехать в лагерь, effects: {fit: 3, ties: 1, close: -1}}
    - {text: Лето во дворе, effects: {ties: 1}}
- id: KID-10
  type: choice
  when: {from: 1986, to: 1999}
  who: {age: [10, 14]}
  text: "Кружок или секция: бокс, борьба, футбол, музыкалка, радиокружок, Дом пионеров, шахматы, комсомол."
  choices:
    - {text: Бокс или борьба, effects: {fit: 6}, sets: [fighter]}
    - {text: Футбол или хоккей, effects: {fit: 5, ties: 1}}
    - {text: Музыкалка или гитара, effects: {know: 2, ties: 1}}
    - {text: Радиокружок или компьютеры, effects: {know: 5}}
    - {text: Шахматы или олимпиады, effects: {know: 5}}
