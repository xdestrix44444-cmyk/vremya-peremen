title: "13. Предложения о работе (JOB)"
note: "Карточка: должность, место, зарплата в месяц, условия, требования. Принять / Отказаться / Торговаться. Зарплаты — ориентиры, сверить с данными."
events:
- id: JOB-01
  type: offer
  repeat: true
  when: {from: 1986, to: 1991}
  who: {role: [young, adult], stats: {fit: ">40"}, job: [unemployed, student, worker]}
  text: "Рабочий на завод, общежитие. 180–250 ₽ в месяц."
  choices:
    - {text: Принять, job: worker}
    - {text: Торговаться, check: {base: 35, ties: 0.3, charm: 10}, success: {text: "Дали разряд повыше.", job: worker, effects: {money_m: 1}}, fail: {text: "«Не нравится — не держим».", effects: {}}}
    - {text: Отказаться, effects: {}}
