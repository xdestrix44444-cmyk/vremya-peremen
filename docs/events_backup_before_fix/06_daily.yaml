  weight: 2
  text: "Свет и отопление отключают по графику. Готовят на буржуйке, спят в куртках."
  effects: {health: -2}
- id: DAY-15
  type: choice
  when: {from: 1992, to: 1999}
  who: {role: [adult, pension]}
  text: "В подъезде обокрали квартиру. Все ставят железные двери."
  choices:
    - {text: Поставить дверь, effects: {money_m: -1}}
    - {text: Обойтись, effects: {}}
- id: DAY-16
  type: scene
  when: {from: 1988, to: 1999}
  text: "Вся семья у экрана: «Рабыня Изаура», «Просто Мария», «Санта-Барбара»."
  effects: {close: 1}
- id: DAY-17
  type: choice
  when: {from: 1993, to: 1999}
  who: {role: [adult]}
  text: "Евроремонт: турецкий кафель, подвесной потолок, пластиковые окна."
  choices:
    - {text: Сделать, effects: {money_m: -15, close: 1}}
    - {text: Нет, effects: {}}
- id: DAY-18
  type: scene
  when: {from: 1993, to: 1995}
  text: "По телевизору Лёня Голубков покупает жене сапоги на доходы от пирамиды."
