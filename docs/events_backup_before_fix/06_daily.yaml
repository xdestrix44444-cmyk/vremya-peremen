- id: DAY-12
  type: scene
  when: {from: 1992, to: 1993}
  text: "Рынок вместо магазина: «Сникерсы», ликёр «Амаретто», спирт Royal, турецкие куртки."
- id: DAY-13
  type: choice
  when: {from: 1992, to: 1996}
  who: {role: [adult, pension]}
  text: "Приватизация квартиры: очереди в БТИ, справки, госпошлина."
