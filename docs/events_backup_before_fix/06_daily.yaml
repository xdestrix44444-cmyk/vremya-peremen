  type: scene
  when: {from: 1991, to: 1999}
  who: {flags: [helped_neighbors]}
  text: "Соседи, которых ты когда-то укрыл, нашли тебя: зовут в гости, помогают деньгами и работой."
  effects: {close: 3, ties: 3, money_m: 1}
