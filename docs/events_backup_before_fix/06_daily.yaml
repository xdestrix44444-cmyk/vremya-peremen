  type: choice
  when: {from: 1994, to: 1999}
  who: {role: [adult]}
  text: "Сосед купил подержанную иномарку из Германии."
  choices:
    - {text: Купить себе, effects: {money_m: -40, ties: 2, close: 1}, item: {add: car}}
    - {text: Нет, effects: {}}
- id: DAY-20
  type: choice
  when: {from: 1995, to: 1999}
  who: {flags: [business]}
  text: "Пейджер, потом мобильный размером с кирпич."
  choices:
    - {text: Купить, effects: {money_m: -8, ties: 2}}
    - {text: Нет, effects: {}}
