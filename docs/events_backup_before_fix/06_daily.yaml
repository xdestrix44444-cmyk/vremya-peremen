  repeat: true
  when: {from: 1986, to: 1999, month: 12}
  text: "Новогодний стол: оливье, мандарины, «Голубой огонёк». Дальше газета года."
  effects: {close: 1}
- id: DAY-22
  type: choice
  repeat: true
  when: {from: 1986, to: 1999}
  who: {role: [young, adult]}
  text: "Сломался телевизор или холодильник."
  choices:
    - {text: Чинить у мастера, effects: {money_m: -0.5}}
    - {text: Купить новый, effects: {money_m: -3, close: 1}}
    - {text: Жить без него, effects: {close: -2}}
