title: "6. Быт (DAY)"
note: "Повседневные события. Появляются чаще всего и задают ощущение эпохи."
events:
- id: DAY-01
  type: choice
  repeat: true
  when: {from: 1986, to: 1991}
  who: {age: [14, 99]}
  weight: 3
  text: "«Выбросили» колбасу. Очередь на два часа, номер пишут ручкой на ладони."
  choices:
    - {text: Встать в очередь, effects: {health: -1, close: 1}}
    - {text: Пройти мимо, effects: {}}
- id: DAY-02
  type: choice
  when: {from: 1986, to: 1991}
  who: {age: [20, 99]}
  text: "Запись на ковёр (стенку, холодильник). Перекличка каждую ночь у магазина."
  choices:
    - {text: Отмечаться, effects: {health: -2, close: 1, money_m: -1}}
    - {text: Плюнуть, effects: {}}
- id: DAY-03
  type: scene
  repeat: true
  when: {from: 1986, to: 1991}
  who: {role: [young, adult]}
  text: "Продуктовый «заказ» к празднику на работе: гречка, шпроты, майонез, банка растворимого кофе."
  effects: {close: 1}
- id: DAY-04
  type: offer
  when: {from: 1986, to: 1991}
  who: {role: [adult], stats: {ties: ">30"}}
  weight: 0.5
  text: "Подошла очередь на «Жигули» по записи с работы."
  choices:
    - {text: Купить, effects: {money_m: -30, close: 3, ties: 1}, item: {add: car}}
    - {text: Уступить очередь за деньги, effects: {money_m: 5, law: 3}}
    - {text: Отказаться, effects: {}}
- id: DAY-05
  type: choice
  repeat: true
  when: {from: 1987, to: 1995}
  who: {age: [10, 50]}
  text: "Видеосалон: боевики с гнусавым переводом, сеанс за рубль."
  choices:
    - {text: Ходить, effects: {ties: 1, money_m: -0.1}}
    - {text: Нет, effects: {}}
- id: DAY-06
  type: choice
  when: {from: 1988, to: 1990}
  who: {age: [16, 99]}
  text: "По телевизору Кашпировский и Чумак «заряжают» воду и кремы."
  choices:
    - {text: Ставить банку перед экраном, effects: {close: 1}}
    - {text: Смеяться, effects: {}}
- id: DAY-07
  type: choice
  when: {from: 1988, to: 1993}
  who: {age: [12, 99]}
  text: "Открываются храмы и мечети. Родня зовёт креститься или на праздник в мечеть."
  choices:
    - {text: Пойти, effects: {close: 1}}
    - {text: Нет, effects: {}}
- id: DAY-08
  type: choice
  when: {from: 1989, to: 1991}
  who: {age: [18, 99]}
  text: "Всё по талонам. Сосед меняет водочные талоны на сахарные."
  choices:
    - {text: Меняться, effects: {ties: 1}}
    - {text: Нет, effects: {}}
- id: DAY-09
  type: scene
  when: {from: 1990, to: 1991}
  text: "Пустые прилавки: берёзовый сок, морская капуста и уксус."
  effects: {views_reform: -3}
- id: DAY-10
  type: scene
  when: {from: 1991, to: 1992}
  who: {role: [pension]}
  text: "«Гуманитарка» из Германии: банки тушёнки, пакеты с поношенной одеждой."
  effects: {close: 1}
