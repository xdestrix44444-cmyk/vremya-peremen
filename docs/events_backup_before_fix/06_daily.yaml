  type: choice
  repeat: true
  when: {from: 1991, to: 1999, month: 5}
  who: {age: [16, 99]}
  weight: 2
  text: "Посадка картошки на даче или огороде."
  choices:
    - {text: Сажать, effects: {money_m: 1, fit: 2, close: 1, health: -1}}
